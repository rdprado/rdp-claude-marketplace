# Sonar analysis parameters for this project. Read by ci/sonar-begin.sh, which
# both bitbucket-pipelines.yml and ci/verify.sh call, so CI and local runs
# (including per-developer local projects) can't drift apart.
#
# Format: one key=value per line, passed to the scanner as /d:key=value.
# No quotes, no line continuations; lines starting with # are comments.
# Project-specific exclusions and ignored rules belong here, with a comment
# saying why (e.g. a legacy file we accept as-is), never in the pnt plugin.
#
# sonar.host.url, sonar.token and sonar.qualitygate.wait are set by
# sonar-begin.sh — don't put them (or any secret) here.

# Coverage report: must be the file the unit-test step writes (opencover for .NET).
sonar.cs.opencover.reportsPaths=coverage/coverage.opencover.xml

# Standard exclusions (pipelines.md -> "Sonar exclusions").
sonar.exclusions=**/*.cshtml,**/*.html,**/*.css,**/*.scss,**/wwwroot/**,**/*.js,**/*.ts,**/Scripts/**,**/node_modules/**,**/Migrations/**
